name: sre-agent-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sre_agent
      POSTGRES_USER: sre_agent
      POSTGRES_PASSWORD: sre_agent
    ports:
      - "55433:5432"
    volumes:
      - ./seed/postgres/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - sre-agent-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sre_agent -d sre_agent"]
      interval: 2s
      timeout: 3s
      retries: 30

  pushgateway:
    image: prom/pushgateway:v1.11.1
    ports:
      - "19093:9091"

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "19092:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - sre-agent-prometheus-data:/prometheus
    depends_on:
      - pushgateway

volumes:
  sre-agent-postgres-data:
  sre-agent-prometheus-data:
